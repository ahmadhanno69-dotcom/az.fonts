const CATS=["all","fancy","cursive","gothic","bubble","aesthetic","glitch","cute","minimal","symbols"];
let cat="all",favs=new Set();

function sT(t){
  document.body.className='theme-'+t;
  document.getElementById('ta').className='tbtn'+(t==='a'?' ta-on':'');
  document.getElementById('tz').className='tbtn'+(t==='z'?' tz-on':'');
}
function rfilt(){document.getElementById('fbar').innerHTML=CATS.map(c=>`<button class="pill${c===cat?' on':''}" onclick="scat('${c}')">${c}</button>`).join('')}
function scat(c){cat=c;rfilt();gen()}
function getlist(){const q=document.getElementById('inp').value||'Hello World';return S.filter(s=>cat==='all'||s.t===cat).map(s=>({...s,out:s.f(q)}))}
function gen(){
  const list=getlist();
  document.getElementById('rcnt').textContent=list.length+' styles';
  document.getElementById('grid').innerHTML=list.map((s,i)=>`
    <div class="card">
      <div class="ch"><span class="cn">${s.n}</span><span class="ct">${s.t}</span></div>
      <div class="cp">${esc(s.out)}</div>
      <div class="cbtns">
        <button class="cbtn" id="cb${i}" onclick="cp2(${i},\`${s.out.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$')}\`)">copy</button>
        <button class="fbtn${favs.has(s.n)?' on':''}" onclick="tfav('${s.n}',this)">♥</button>
      </div>
    </div>`).join('');
}
function cp2(i,txt){navigator.clipboard.writeText(txt).then(()=>{const b=document.getElementById('cb'+i);b.textContent='copied!';b.classList.add('ok');setTimeout(()=>{b.textContent='copy';b.classList.remove('ok')},1500);toast('copied!')})}
function copyAll(){const all=getlist().map(s=>s.n+': '+s.out).join('\n');navigator.clipboard.writeText(all).then(()=>toast('all '+getlist().length+' copied!'))}
function tfav(n,b){if(favs.has(n)){favs.delete(n);b.classList.remove('on')}else{favs.add(n);b.classList.add('on');toast('saved ♥')}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
rfilt();gen();
